name: Snapshot portfolio

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 08:47 Asia/Kolkata (03:17 UTC).
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: portfolio-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync live sources and save daily snapshot
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$PORTFOLIO_OWNER_EMAIL" ] || [ -z "$PORTFOLIO_EVM_ADDRESSES" ] || [ -z "$BINANCE_API_KEY" ] || [ -z "$BINANCE_API_SECRET" ]; then
            echo "::notice::Weekly snapshot skipped because the required repository secrets are not configured."
            exit 0
          fi
          node scripts/sync-portfolio.mjs --only=rabby,hyperliquid,binance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PORTFOLIO_OWNER_EMAIL: ${{ secrets.PORTFOLIO_OWNER_EMAIL }}
          PORTFOLIO_EVM_ADDRESSES: ${{ secrets.PORTFOLIO_EVM_ADDRESSES }}
          PORTFOLIO_HYPERLIQUID_ADDRESSES: ${{ secrets.PORTFOLIO_HYPERLIQUID_ADDRESSES }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          PORTFOLIO_TIME_ZONE: Asia/Kolkata
